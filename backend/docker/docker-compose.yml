services:
  postgres-db:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # RabbitMQ — Message Broker para eventos del sistema
  # Panel de administración: http://localhost:15672
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management

    restart: always

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"     # AMQP protocol
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # Management UI

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
